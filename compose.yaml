# halogen-stack, фаза 1 (MVP): внутренний контур без публичного входа.
# Канон архитектуры: docs/architecture.md
name: halogen-stack

networks:
  internal:
    internal: true   # без шлюза: участники не имеют выхода в интернет
  egress:
    internal: true   # web-ui <-> egress-proxy, без шлюза: у web-ui нет прямого пути наружу
  wan:
    driver: bridge   # единственная сеть со шлюзом наружу; в ней только egress-proxy
  # Фаза 2: waf-firewall <-> reverse-proxy. Объявлена здесь, чтобы compose.public.yaml
  # добавляла сервис в тот же проект. internal: true — у waf нет и не должно быть
  # исходящего интернета (сертификаты приходят файлами с хоста).
  public:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  webui_data:

services:
  halogen-flash-server:
    image: ghcr.io/peonist-ai/halogen-flash-server:0.20.4
    container_name: halogen-flash-server
    restart: unless-stopped
    networks: [internal]
    # Портов на хосте нет: доступен только reverse-proxy (networks: internal).
    # В MVP работает БЕЗ HALOGEN_API_KEY (решение §1.2 CLAUDE.md; ключ — roadmap).
    # ТЕСТ СЕРВЕРА (§7 architecture): заменить ipc:host на приватный ipc + shm_size.
    ipc: host
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=64m,mode=1777
    cap_drop: [ALL]
    # ТЕСТ СЕРВЕРА: если ROCm потребует NET_RAW/NET_BIND_SERVICE — вернуть явно.
    security_opt: [no-new-privileges:true]
    ulimits:
      memlock: {soft: -1, hard: -1}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add: [keep-groups]
    environment:
      HALOGEN_CTX: "262144"
      HALOGEN_KV_POOL_POSITIONS: "524288"
      HALOGEN_KV_SLOTS: "4"
      HALOGEN_MAX_TOKENS_DEFAULT: "16384"
      HALOGEN_MAX_TOK: "16384"
      HALOGEN_REASONING_EFFORT: xhigh
      # Дисковый prompt-кэш ВКЛЮЧЁН решением 2026-11-12: под него выделен
      # отдельный диск (931.5G, ext4, точка /srv/halogen-cache — см.
      # docs/admin-cache-disk.md). Прежняя причина отказа от него (решение
      # 2026-10-28) — конец места на /: слой пишет ~27 KiB на токен контекста
      # (reference configuration.md:344) и разросся до 42 GiB за 14 минут при
      # 33 GiB свободных. Отдельный диск снимает и это, и конкуренцию с
      # n-gram-таблицей 47.7 GiB, которую prefill читает с корневого раздела.
      # Что это НЕ решает: давление KV-пула (§7.2 CLAUDE.md) — пул живёт в RAM,
      # дисковый слой его не разгружает.
      # DISK_GIB=640 при ёмкости ~868 GiB: лимит обязан быть заметно меньше
      # места, иначе LRU не включается никогда (дефолт 64 в 2026-10-28 был
      # больше свободного места — чистка не сработала ни разу). Переполнение
      # возможно максимум на один разговор: вытеснение начинается, когда НОВЫЙ
      # разговор превышает лимит (reference docs/FLAGS.md:135).
      # PRUNE_OLD=1: лимит ограничивает только поддерево ТЕКУЩЕЙ конфигурации
      # (reference configuration.md:366-371), а прошлый апгрейд образа оставляет
      # своё поддерево навечно — без чистки старые и есть незафиксированный рост.
      # Цена: откат образа застанет холодный кэш.
      HALOGEN_CACHE_DIR: /cache
      HALOGEN_CACHE_DISK_GIB: "640"
      HALOGEN_CACHE_PRUNE_OLD: "1"
      # Ветвлений на разговор — 3 вместо 2 (решение человека 2026-11-12).
      # Дефолтные 2 = «разговор плюс один side-turn»; при 2 точка возобновления
      # РОДИТЕЛЯ заменяется записями детей, и на следующем ходе родитель
      # перечитывает всю историю. 3 = «родитель, разветвлённый на двух детей» —
      # это ровно веер Claude Code с субагентами (reference docs/FLAGS.md:118).
      # Цена не в слотах, а в записях prompt-кэша: их число по умолчанию
      # выводится из ветвлений — при 4 слотах 28 → 36 записей, ~111 MiB каждая,
      # то есть ≈ 3.1 → 3.9 GiB RAM. На содержимое ответов не влияет: «changes
      # only what is cached, never what an answer is».
      # Рядом осознанно НЕ тронуто (мерить, а не угадывать — §7.2 CLAUDE.md):
      # HALOGEN_CTX остаётся 262144 (это родное окно модели, выше — только YaRN-1M
      # ценой качества и 25 GB KV на разговор), HALOGEN_KV_SLOTS=4 и
      # HALOGEN_KV_POOL_POSITIONS=524288. Прогон 2026-11-12 на 0.20.4 дал
      # `cannot grow` 0 и `was shortened` 0 при пике пула 99% — если точный
      # признак обреза появится в бою, следующим идёт пул 786432 (+7.2 GiB).
      HALOGEN_CACHE_BRANCHES: "3"
      # Образ по-прежнему сам ставит HALOGEN_FORK=1, если переменная не задана
      # (reference deploy/entrypoint.sh:1014), — значение должен видеть образ,
      # одних закомментированных переменных выше мало. Auto-keep
      # (HALOGEN_FORK_MAP=auto) с 0.18.16 выключен самим апстримом (#207, #208),
      # так что прежняя причина «образ включает auto-keep и раздувает /cache» на
      # этом пине уже не действует. При 1 остаются живы именованные keep-состояния
      # по заголовку X-Halogen-Keep, а их имена — общее пространство для всех
      # ключей сервера (reference FLAGS.md:157). Claude Code эти заголовки не
      # шлёт, поэтому держим 0: механизм не используется и не плодит состояния
      # (~0.1 GiB RAM + позиции KV-пула на каждое, reference FLAGS.md:160).
      HALOGEN_FORK: "0"
    # При остановке флешится последний ход prompt-кэша, и podman по умолчанию
    # ждёт только 10 с — за это время диск не успевает дописаться (справочник
    # ставит 60 с, reference docker-compose.yml:153). Актуально с 2026-11-12,
    # когда дисковый слой включён.
    stop_grace_period: 60s
    volumes:
      - ${HALOGEN_MODELS_DIR}:/models:ro
      # Каталог на выделенном диске. Страховки от «кэш поехал на /» три: сама
      # структура каталогов (prompt-cache существует только на диске, §3
      # admin-cache-disk.md), GUARD_CACHE_DIR в Makefile (внятное сообщение) и
      # `${…:?}` здесь — она закрывает запуск в обход make, по образцу LAN_IP.
      # Суффикс `:/cache:z` обязан быть снаружи `${}` — всё после `}`
      # podman-compose считает продолжением значения (§5 CLAUDE.md).
      - "${HALOGEN_CACHE_DIR_HOST:?HALOGEN_CACHE_DIR_HOST не задан — дисковый кэш уехал бы на корневой раздел}:/cache:z"

  reverse-proxy:
    image: docker.io/library/caddy:2
    container_name: halogen-reverse-proxy
    restart: unless-stopped
    # public — фаза 2: сюда приходит трафик от waf-firewall (публичный путь).
    networks: [internal, public]
    ports:
      # bind только на LAN-интерфейс (агенты); НЕ 0.0.0.0 — см. тест-чек §7.
      # Пустой LAN_IP дал бы ":8731:8080" = публикацию на всех адресах. Страховки
      # две, обе нужны: GUARD_LAN_IP в Makefile (внятное сообщение, ловит и
      # пустое значение из окружения) и `${LAN_IP:?…}` здесь — она закрывает
      # запуск в обход make, прямой вызов podman-compose (решение человека
      # 2026-10-28). Падает трейсбеком RuntimeError — некрасиво, но громко.
      # Суффикс ":8731:8080" — часть значения, он обязан быть внутри `${…}`.
      - "${LAN_IP:?LAN_IP не задан — 8731 нельзя публиковать на 0.0.0.0}:8731:8080"
    environment:
      # Нужен Caddyfile: по Host различает публичный путь (только web-ui) и
      # LAN-путь агентов (/v1/*). Значение по умолчанию — чтобы фаза 1 работала
      # и без строки в .env.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-ai.dda2543.ru}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - internal-auth-provider
      - halogen-flash-server

  internal-auth-provider:
    build: ./auth-provider
    image: localhost/halogen-auth-provider:0.1
    container_name: halogen-auth-provider
    restart: unless-stopped
    networks: [internal]
    # Портов на хосте нет: его спрашивает только reverse-proxy (forward_auth).
    # rootless podman: uid 0 в контейнере = uid администратора хоста, поэтому
    # процесс читает host-файл keys.acl (0600, владелец — админ) без chown и без
    # флага монтирования U (U переставлял владельца на подuid — файл переставал
    # принадлежать админу и читался лишь через `podman unshare`). read_only /
    # cap_drop / no-new-privileges в силе; «root» здесь — непривилегированный
    # пользователь хоста, не настоящий root.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${SECRETS_DIR:-./secrets}/keys.acl:/etc/auth-provider/keys.acl:ro,z
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  web-ui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: halogen-web-ui
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      OPENAI_API_BASE_URL: http://reverse-proxy:8080/v1
      OPENAI_API_KEY: ${WEBUI_SERVICE_KEY:?WEBUI_SERVICE_KEY задаётся в .env (make key-add NAME=webui)}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY задаётся в .env}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      # Open WebUI по умолчанию тянет с HuggingFace эмбеддинг-модель
      # (RAG_EMBEDDING_MODEL=all-MiniLM-L6-v2) и проверяет новые версии — egress-proxy
      # это режет (403), и это правильно: бинарники всё равно не пройдут проверку
      # Content-Type в squid. OFFLINE_MODE ставит HF_HUB_OFFLINE=1 и выключает
      # auto-update embedding/rerank/whisper и проверку версий
      # (/docs/open-webui/backend/open_webui/env.py:1225). Цена: RAG-встраивания в
      # MVP не работают; для RAG монтировать кэш HF отдельным томом (roadmap).
      OFFLINE_MODE: "true"
      # Весь исходящий трафик — только через egress-proxy (whitelist+GET).
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: reverse-proxy,internal-auth-provider,localhost,127.0.0.1
    volumes:
      - webui_data:/app/backend/data

  egress-proxy:
    # Пин по digest: тег 6.6-24.04_beta мутабелен (Canonical пересобирает с
    # патчами). Bump: skopeo inspect docker://docker.io/ubuntu/squid:6.6-24.04_beta
    # → новый Digest → сюда → тест на сервере. База — Ubuntu LTS noble, squid 6.6.
    image: docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029  # 6.6-24.04_beta (amd64)
    container_name: halogen-egress-proxy
    restart: unless-stopped
    networks: [egress, wan]   # единственный контейнер с маршрутом в интернет (wan)
    volumes:
      - ./config/squid/squid.conf:/etc/squid/squid.conf:ro,z
      - ./config/squid/whitelist.txt:/etc/squid/whitelist.txt:ro,z
